name: Jenkins Security Scan
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  security-events: write
  contents: read # For actions/checkout in the reusable workflow
  actions: read # For github/codeql-action/upload-sarif

jobs:
  security-scan:
    uses: jenkins-infra/jenkins-security-scan/.github/workflows/jenkins-security-scan.yaml@da7438f10fecc21e40174d420ef34daae0874122 # v2
    with:
      java-cache: 'maven'
      java-version: '21'
